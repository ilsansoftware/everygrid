<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8'/>
  <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout viewport (dvh),
       so the fixed header stays put and .demo-scroll shrinks — the focused search box settles above
       the keyboard instead of the page jumping under the browser chrome. -->
  <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content'/>
  <title>everygrid</title>
  <link rel='icon' type='image/x-icon' href='/favicon.ico'/>
</head>
<body>
<div id='root'></div>
<script src='./src/main.tsx' type='module'></script>
</body>
</html>
