<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <link rel='icon' type='image/x-icon' href='./favicon.ico'/>
  <link rel='stylesheet' href='./index.css'/>
  <title>Everygrid Explorer — jQuery Demo</title>
  <!-- jQuery -->
  <script src='https://code.jquery.com/jquery-3.7.1.min.js'></script>
  <!-- everygrid — usage in a plain HTML page with a single <script> tag (no bundler).
       The src is substituted by vite.config.ts: the workspace builds when served
       locally, the deployed CDN standalone when built. -->
  <script src='%EVERYGRID_STANDALONE%'></script>
</head>
<body>

<div class='container'>
  <main>
    <div class='page-tools'>
      <div class='locale-btn-group' role='group' aria-label='Language'>
        <button type='button' class='locale-btn' data-locale='ko' title='한국어'>🇰🇷</button>
        <button type='button' class='locale-btn active' data-locale='en' title='English'>🇺🇸</button>
      </div>
    </div>
    <div id='demo-grid'></div>
    <div id='demo-grid2'></div>
  </main>
</div>

<script>
  (function ($, everygrid) {
    // Language toggle: setLocale switches every grid on the page and re-renders it. Explicit 'en' at
    // start so the grids and the toggle agree, whatever the browser language.
    everygrid.setLocale('en');
    $('.locale-btn').on('click', function () {
      everygrid.setLocale($(this).data('locale'));
      $('.locale-btn').removeClass('active');
      $(this).addClass('active');
    });

    // Fetch data, optionally filtered by userId
    function getData() {
      return fetch('./data.json').then(function (r) {
        return r.json();
      });
    }

    function getData2() {
      return fetch('./data2.json')
      .then(res => res.json());
    }

    // createGrid autoloads everygrid.config.json from this page's own directory (relative), so
    // no explicit config load is needed.
    everygrid.createGrid('demo-grid', () => getData());
    everygrid.createGrid('demo-grid2', () => getData2().then(json => json.results));
  }(window.jQuery, window.Everygrid));
</script>
</body>
</html>
