<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <link rel='icon' type='image/x-icon' href='favicon.ico'/>
  <link rel='stylesheet' href='./index.css'/>
  <title>Everygrid Explorer — Vanilla JS Demo</title>
  <!-- everygrid — usage in a plain HTML page with a single <script> tag (no bundler).
       The src is substituted by vite.config.ts: the workspace builds when served
       locally, the deployed CDN standalone when built. -->
  <script src='%EVERYGRID_STANDALONE%'></script>
</head>
<body>
<div class='container'>
  <main>
    <div id='demo-grid'></div>
    <div id='users'></div>
  </main>
</div>
<script>
  const everygrid = window.Everygrid;
  // Apply locale pushed by the portal (this page is embedded in an iframe). One line — the library
  // owns the message handshake; the portal side calls everygrid's sendLocale(...).
  everygrid.listenForLocale({source: window.parent});
  // createGrid autoloads everygrid.config.json from this page's own directory (relative), so no
  // explicit config load is needed.
  everygrid.createGrid('demo-grid', function () {
    return fetch('./data.json').then(function (r) {
      return r.json();
    });
  });
  everygrid.createGrid('users', function () {
    return fetch('https://jsonplaceholder.typicode.com/users').then(function (r) {
      return r.json();
    });
  });
</script>
</body>
</html>
