<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <link rel='icon' type='image/x-icon' href='favicon.ico'/>
  <link rel='stylesheet' href='./index.css'/>
  <title>Everygrid Explorer — Vanilla JS Demo</title>
  <!-- everygrid — usage in a plain HTML page with a single <script> tag (no bundler).
       The src is substituted by vite.config.ts: the workspace builds when served
       locally, the deployed CDN standalone when built. -->
  <script src='%EVERYGRID_STANDALONE%'></script>
</head>
<body>
<div class='container'>
  <main>
    <div class='page-tools'>
      <div class='locale-btn-group' role='group' aria-label='Language'>
        <button type='button' class='locale-btn' data-locale='ko' title='한국어'>🇰🇷</button>
        <button type='button' class='locale-btn active' data-locale='en' title='English'>🇺🇸</button>
      </div>
    </div>
    <div id='demo-grid'></div>
    <div id='users'></div>
  </main>
</div>
<script>
  const everygrid = window.Everygrid;
  // Language toggle: setLocale switches every grid on the page and re-renders it. Explicit 'en' at
  // start so the grids and the toggle agree, whatever the browser language.
  everygrid.setLocale('en');
  document.querySelectorAll('.locale-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      everygrid.setLocale(btn.dataset.locale);
      document.querySelectorAll('.locale-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
    });
  });
  // createGrid autoloads everygrid.config.json from this page's own directory (relative), so no
  // explicit config load is needed.
  everygrid.createGrid('demo-grid', function () {
    return fetch('./data.json').then(function (r) {
      return r.json();
    });
  });
  everygrid.createGrid('users', function () {
    return fetch('https://jsonplaceholder.typicode.com/users').then(function (r) {
      return r.json();
    });
  });
</script>
</body>
</html>
