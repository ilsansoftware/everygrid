<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <link rel='icon' type='image/x-icon' href='favicon.ico'/>
  <link rel='stylesheet' href='./index.css'/>
  <title>Everygrid Explorer — Vanilla JS Demo</title>
  <!-- everygrid — usage in a plain HTML page with a single <script> tag (no bundler).
       The src is substituted by vite.config.ts: the workspace builds when served
       locally, the deployed CDN standalone when built. -->
  <script src='%EVERYGRID_STANDALONE%'></script>
</head>
<body>
<div class='container'>
  <main>
    <div class='page-tools'>
      <div id='locale-switch'></div>
    </div>
    <div id='demo-grid'></div>
    <div id='users'></div>
  </main>
</div>
<script>
  const everygrid = window.Everygrid;
  // Language switch: mountLocaleSwitch draws the toggle into #locale-switch and wires it to
  // setLocale (every grid on the page switches); persist remembers the choice across reloads.
  everygrid.mountLocaleSwitch('#locale-switch', {type: 'button', defaultLocale: 'en', persist: true});
  // mountGrid autoloads everygrid.config.json from this page's own directory (relative), so no
  // explicit config load is needed.
  everygrid.mountGrid('demo-grid', function () {
    return fetch('./data.json').then(function (r) {
      return r.json();
    });
  });
  everygrid.mountGrid('users', function () {
    return fetch('https://jsonplaceholder.typicode.com/users').then(function (r) {
      return r.json();
    });
  });
</script>
</body>
</html>
