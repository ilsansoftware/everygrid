name: Bug report
description: Something in the grid doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Everygrid version
      placeholder: '0.6.4'
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: How do you load it?
      options:
        - React (npm)
        - Script tag / CDN (standalone)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 155, macOS
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal grid config and data are the fastest way to a fix.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
