[package]
name = "everygrid-wasm"
version = "0.1.0"
edition = "2021"
description = "Filter/sort/paginate engine for the Everygrid data grid, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/ilsansoftware/everygrid"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false